kind = "api"
previewPath = "/"
title = "Car Price Prediction API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8000
name = "API Server"
paths = ["/"]

[services.development]
run = "cd ../.. && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

[services.production]

[services.production.run]
args = ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

[services.production.health.startup]
path = "/"
